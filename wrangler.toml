name = "fullstack-guide"
compatibility_date = "2026-08-30"
pages_build_output_dir = "out"

# Cloudflare Workers AI（语义搜索 embedding，免费，无需 API key）
[ai]
binding = "AI"

# R2 边缘存储桶（图片/附件/SDK 静态资源；Function 通过 env.R2_STORE 边缘直读）
# 注意：Pages 项目内 ASSETS 为保留名（静态资源命名空间），故用 R2_STORE。
[[r2_buckets]]
binding = "R2_STORE"
bucket_name = "guide-assets"
